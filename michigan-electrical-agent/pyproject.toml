[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "michigan-electrical-agent"
version = "0.1.0"
description = "Citation-first residential electrical assistant for one house in Canton, Michigan"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "llama-index>=0.11.0",
  "chromadb>=0.5.0",
  "pdfplumber>=0.11.0",
  "pymupdf>=1.24.0",
  "python-docx>=1.1.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "typer>=0.12.0",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.1",
  "openai>=1.30.0",
  "anthropic>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[project.scripts]
mea = "cli.main:app"

[tool.setuptools]
package-dir = {"" = "."}
